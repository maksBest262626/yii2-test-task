services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: yii2_php
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-yii2_catalog}
      DB_USER: ${DB_USER:-yii2}
      DB_PASSWORD: ${DB_PASSWORD:-yii2password}
      COOKIE_VALIDATION_KEY: ${COOKIE_VALIDATION_KEY:-}
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: yii2_nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: yii2_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-yii2_catalog}
      MYSQL_USER: ${DB_USER:-yii2}
      MYSQL_PASSWORD: ${DB_PASSWORD:-yii2password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data: